# centralized-by: HereLiesAz/workflows
# central-source-path: .github/workflows/morphont-publish.yml
# central-source-sha256: 825e6e5a5cbc7d80f2854e239557599c354131b24dee94d3c14b806f640ce98b
# This file intentionally contains no repository secrets.
name: Publish Android [central proxy]

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_play:
        description: Upload the signed AAB to Google Play?
        required: false
        default: false
        type: boolean
      track:
        description: Google Play track
        required: false
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      status:
        description: Google Play release status
        required: false
        default: draft
        type: choice
        options:
          - draft
          - completed

permissions:
  contents: read
  id-token: write

jobs:
  central-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to HereLiesAz/workflows
        env:
          WORKFLOWS_GATEWAY_URL: ${{ vars.WORKFLOWS_GATEWAY_URL }}
          EVENT_JSON: ${{ toJSON(github.event) }}
          INPUTS_JSON: ${{ toJSON(inputs) }}
          VARS_JSON: ${{ toJSON(vars) }}
          SOURCE_WORKFLOW_PATH: .github/workflows/morphont-publish.yml
          SOURCE_SHA256: 825e6e5a5cbc7d80f2854e239557599c354131b24dee94d3c14b806f640ce98b
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${WORKFLOWS_GATEWAY_URL:-}" ]] || {
            echo "Repository variable WORKFLOWS_GATEWAY_URL is not configured." >&2
            exit 1
          }
          oidc_response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hereliesaz-workflows")"
          oidc_token="$(jq -r '.value // empty' <<<"$oidc_response")"
          [[ -n "$oidc_token" ]] || {
            echo "GitHub did not issue an OIDC token." >&2
            exit 1
          }
          echo "::add-mask::$oidc_token"
          payload="$(jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg repository_id "$GITHUB_REPOSITORY_ID" \
            --arg repository_owner "$GITHUB_REPOSITORY_OWNER" \
            --arg repository_owner_id "$GITHUB_REPOSITORY_OWNER_ID" \
            --arg sha "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            --arg ref_name "$GITHUB_REF_NAME" \
            --arg ref_type "$GITHUB_REF_TYPE" \
            --arg head_ref "$GITHUB_HEAD_REF" \
            --arg base_ref "$GITHUB_BASE_REF" \
            --arg actor "$GITHUB_ACTOR" \
            --arg actor_id "$GITHUB_ACTOR_ID" \
            --arg event_name "$GITHUB_EVENT_NAME" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_number "$GITHUB_RUN_NUMBER" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg workflow_name "$GITHUB_WORKFLOW" \
            --arg source_workflow_path "$SOURCE_WORKFLOW_PATH" \
            --arg source_sha256 "$SOURCE_SHA256" \
            --argjson event "$EVENT_JSON" \
            --argjson inputs "$INPUTS_JSON" \
            --argjson vars "$VARS_JSON" \
            '{repository:$repository,repository_id:$repository_id,repository_owner:$repository_owner,repository_owner_id:$repository_owner_id,sha:$sha,check_sha:($event.pull_request.head.sha // $sha),ref:$ref,ref_name:$ref_name,ref_type:$ref_type,head_ref:$head_ref,base_ref:$base_ref,actor:$actor,actor_id:$actor_id,event_name:$event_name,event:$event,inputs:$inputs,vars:$vars,run_id:$run_id,run_number:$run_number,run_attempt:$run_attempt,workflow_ref:$workflow_ref,workflow_name:$workflow_name,source_workflow_path:$source_workflow_path,source_sha256:$source_sha256}')"
          curl --fail-with-body --silent --show-error \
            -X POST "${WORKFLOWS_GATEWAY_URL%/}/dispatch" \
            -H "Authorization: Bearer $oidc_token" \
            -H "Content-Type: application/json" \
            --data-binary "$payload"
