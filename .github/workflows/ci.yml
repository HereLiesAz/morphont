name: CI

# Compiles the Kotlin/Wasm target and builds the production distribution
# on every push and pull request, so a broken build is caught before
# it lands on main (and, downstream, before pages.yml tries to deploy
# something that doesn't build).
on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # GITHUB_ACTOR/GITHUB_TOKEN authenticate against HereLiesAz/convey's GitHub Packages
      # repository (see build.gradle.kts's convey dependency) -- required even to download a
      # public package.
      - name: Build production Wasm distribution
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew wasmJsBrowserDistribution --no-daemon
