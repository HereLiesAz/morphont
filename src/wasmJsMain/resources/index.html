<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Morphont</title>
  <meta name="description" content="Build a variable-font character from five hand-drawn anchors and watch every weight and width in between fall out of the math." />
  <meta name="theme-color" content="#070707" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <style>
    html, body, #root { height: 100%; margin: 0; padding: 0; background: #070707; }
    body { overflow: hidden; }
    /* Splash: the logo on the ground while Wasm loads; Main.kt removes it once Compose is up. */
    #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #070707; z-index: 10; }
    #splash img { width: min(40vw, 220px); height: auto; }
  </style>
</head>
<body>
  <div id="splash"><img src="icons/icon-maskable-512.png" alt="Morphont" /></div>
  <script src="morphont.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(() => {
          // offline install is a nice-to-have, not a hard requirement -- fail quietly
        });
      });
    }
  </script>
</body>
</html>
